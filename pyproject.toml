[project]
name = "PersonalWebsite"
version = "0.1.0"
description = ""
authors = [{ name = "Szymon" }]
requires-python = ">=3.11,<4"
readme = "README.md"
dependencies = [
    "Django>=4.2,<5",
    "wagtail>=5.2,<6",
    "ariadne>=0.21,<0.22",
    "ariadne-django>=0.3.0,<0.4",
    "ruff>=0.1.7,<0.2",
    "wagtail-headless-preview>=0.7.0,<0.8",
    "django-cors-headers>=4.3.1,<5",
    "python-environ>=0.4.54,<0.5",
    "dj-database-url>=2.1.0,<3",
    "psycopg2-binary>=2.9.9,<3",
    "gunicorn>=21.2.0,<22",
    "whitenoise[brotli]>=6.6.0,<7",
    "django-storages>=1.14.2,<2",
    "boto3>=1.34.35,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = [
    "E", 
    "F",
    "I"
]
ignore = ["F403", "F405", "E501"]

[tool.hatch.build.targets.wheel]
packages = ["src"]